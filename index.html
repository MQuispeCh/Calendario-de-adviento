<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>24 sorpresas para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#1b1433; --night2:#2a1f4d; --gold:#f5c76b; --pink:#ff8fb3; --mint:#7fd8be;
    --cream:#fff8ee; --ink:#2b2140; --soft:#b9aed6;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{font-family:Nunito,system-ui,sans-serif;color:#fff;overflow-x:hidden;
    background:radial-gradient(120% 70% at 50% 0%, #3b2a6b 0%, var(--night2) 40%, var(--night) 100%) fixed}
  .hand{font-family:Caveat,cursive}

  /* estrellas y nieve */
  #sky{position:fixed;inset:0;pointer-events:none;z-index:0}
  .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:blink 3s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
  .flake{position:fixed;top:-10px;color:#fff;opacity:.8;pointer-events:none;z-index:1;animation:snow linear infinite}
  @keyframes snow{to{transform:translateY(110vh) translateX(30px)}}

  /* luces navideñas */
  .lights{position:relative;height:46px;display:flex;justify-content:space-around;align-items:flex-start;padding:0 6px;z-index:2}
  .lights::before{content:"";position:absolute;left:0;right:0;top:-18px;height:40px;border-bottom:2px solid #4a3d6e;border-radius:0 0 50% 50%}
  .bulb{width:11px;height:17px;border-radius:50% 50% 45% 45%;margin-top:14px;position:relative;animation:glow 1.6s ease-in-out infinite}
  .bulb::before{content:"";position:absolute;top:-5px;left:2px;width:7px;height:6px;background:#4a3d6e;border-radius:2px}
  .bulb:nth-child(4n+1){background:var(--pink);color:var(--pink)}
  .bulb:nth-child(4n+2){background:var(--gold);color:var(--gold);animation-delay:.4s}
  .bulb:nth-child(4n+3){background:var(--mint);color:var(--mint);animation-delay:.8s}
  .bulb:nth-child(4n){background:#9db4ff;color:#9db4ff;animation-delay:1.2s}
  .bulb:nth-child(odd){margin-top:22px}
  @keyframes glow{0%,100%{box-shadow:0 0 14px 3px currentColor;opacity:1}50%{box-shadow:0 0 4px 0 currentColor;opacity:.55}}

  section{position:relative;z-index:2}

  /* ---------- INTRO ---------- */
  #intro{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 24px 40px;text-align:center}
  .hi{font-size:18px;color:var(--soft);letter-spacing:.04em}
  .name{font-family:Caveat,cursive;font-size:64px;line-height:1;color:var(--gold);margin:4px 0 6px;text-shadow:0 0 22px rgba(245,199,107,.45)}
  .bigbox{position:relative;width:170px;height:170px;margin:34px auto 30px;cursor:pointer;animation:wiggle 2.4s ease-in-out infinite}
  @keyframes wiggle{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-6deg)}88%{transform:rotate(6deg)}92%{transform:rotate(-4deg)}96%{transform:rotate(3deg)}}
  .bigbox .b{position:absolute;left:10px;right:10px;bottom:0;height:120px;background:var(--pink);border-radius:8px;box-shadow:inset 0 -14px 0 rgba(0,0,0,.08),0 20px 40px -14px rgba(0,0,0,.6)}
  .bigbox .b::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:26px;margin-left:-13px;background:var(--gold)}
  .bigbox .l{position:absolute;left:0;right:0;top:22px;height:38px;background:#ff7aa6;border-radius:7px;z-index:2;transition:transform .8s cubic-bezier(.3,1.5,.5,1)}
  .bigbox .l::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:26px;margin-left:-13px;background:#f0b94f}
  .bowsvg{position:absolute;left:50%;top:-50px;width:124px;margin-left:-62px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
  .bigbox.open{animation:none}
  .bigbox.open .l{transform:translate(70px,-120px) rotate(35deg)}
  .bigbox .pop{position:absolute;left:50%;bottom:60px;font-size:60px;transform:translate(-50%,40px) scale(.3);opacity:0;transition:.7s .25s cubic-bezier(.3,1.6,.5,1);z-index:1}
  .bigbox.open .pop{transform:translate(-50%,-30px) scale(1);opacity:1}
  .lead{font-size:17px;max-width:300px;line-height:1.45;margin-bottom:26px}
  .lead b{color:var(--gold)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;cursor:pointer;text-decoration:none;
    background:linear-gradient(135deg,var(--gold),#ffb36b);color:var(--ink);font:800 16px Nunito,sans-serif;
    padding:16px 30px;border-radius:999px;width:100%;max-width:300px;box-shadow:0 10px 28px -8px rgba(245,170,90,.7);transition:transform .15s}
  .btn:active{transform:scale(.96)}
  .btn.wa{background:#25d366;color:#fff;box-shadow:0 10px 24px -8px rgba(37,211,102,.7)}
  .hint{font-size:15px;font-family:Caveat,cursive;font-size:22px;color:var(--soft);margin-top:14px}

  /* ---------- CALENDARIO ---------- */
  #cal{display:none;max-width:520px;margin:0 auto;padding:6px 14px 50px}
  #cal header{text-align:center;margin:8px 0 22px}
  #title{font-family:Caveat,cursive;font-size:44px;line-height:1;color:var(--gold);user-select:none;-webkit-user-select:none}
  #status{font-size:14px;color:var(--soft);margin-top:6px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 12px;padding-top:12px}
  .gift{position:relative;height:84px;border:0;background:none;cursor:pointer;font-family:Nunito}
  .gift .bd{position:absolute;left:6%;right:6%;bottom:0;height:62px;border-radius:6px;background:var(--c);
    box-shadow:inset 0 -9px 0 rgba(0,0,0,.1),0 10px 18px -8px rgba(0,0,0,.6)}
  .gift .bd::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:12px;margin-left:-6px;background:var(--r)}
  .gift .ld{position:absolute;left:0;right:0;bottom:56px;height:20px;border-radius:5px;background:var(--c);filter:brightness(1.08);z-index:2;
    transition:transform .6s cubic-bezier(.3,1.5,.5,1)}
  .gift .ld::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:12px;margin-left:-6px;background:var(--r)}
  .gift .ld svg{position:absolute;left:50%;top:-17px;width:44px;margin-left:-22px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
  .gift .num{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:3;background:var(--cream);color:var(--ink);
    font:800 13px Nunito;padding:2px 7px;border-radius:6px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
  .gift .peek{position:absolute;left:50%;bottom:40px;font-size:30px;transform:translate(-50%,20px) scale(.4);opacity:0;transition:.5s .15s cubic-bezier(.3,1.6,.5,1);z-index:1}
  .gift .lock{position:absolute;right:2px;top:6px;font-size:13px;z-index:4;opacity:.9}
  .gift.locked .bd,.gift.locked .ld{filter:saturate(.35) brightness(.75)}
  .gift.ready{animation:hop 2s ease-in-out infinite}
  .gift.ready .bd{box-shadow:inset 0 -9px 0 rgba(0,0,0,.1),0 0 22px 2px rgba(245,199,107,.55)}
  @keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-7px)}90%{transform:translateY(0)}}
  .gift.opened .ld{transform:translate(18px,-16px) rotate(28deg)}
  .gift.opened .peek{transform:translate(-50%,-2px) scale(1);opacity:1}
  .gift:active{transform:scale(.94)}

  /* lista de lo que me debe */
  .owed{margin-top:34px;background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.25);border-radius:16px;padding:16px 18px}
  .owed h3{font-family:Caveat,cursive;font-size:30px;color:var(--pink);font-weight:700}
  .owed p.e{font-size:13px;color:var(--soft);margin-top:4px}
  .owed ul{list-style:none;margin-top:8px}
  .owed li{font-size:14px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:10px;align-items:center}
  .owed li:last-child{border:0}
  .owed li small{margin-left:auto;color:var(--soft);font-size:11px}
  .foot{text-align:center;font-family:Caveat,cursive;font-size:22px;color:var(--soft);margin-top:24px}

  /* toast */
  #toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);background:var(--cream);color:var(--ink);font-weight:700;
    padding:11px 20px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:50;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* polaroid */
  #modal{position:fixed;inset:0;background:rgba(15,10,30,.7);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:22px;z-index:40}
  #modal.show{display:flex}
  .pol{position:relative;width:100%;max-width:340px;animation:drop .6s cubic-bezier(.2,1.3,.4,1)}
  @keyframes drop{from{transform:translateY(-60px) rotate(-10deg);opacity:0}to{transform:rotate(-2deg);opacity:1}}
  .frame{background:var(--cream);padding:14px 14px 18px;border-radius:4px;box-shadow:0 24px 50px -10px rgba(0,0,0,.7);transform:rotate(-2deg);color:var(--ink)}
  .tape{position:absolute;top:-12px;left:50%;width:90px;height:26px;margin-left:-45px;background:rgba(255,220,160,.75);transform:rotate(3deg);z-index:2}
  .photo{aspect-ratio:1/1;border-radius:2px;display:grid;place-items:center;position:relative;overflow:hidden}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .photo .emo{font-size:120px;filter:drop-shadow(0 12px 14px rgba(0,0,0,.25));animation:float 3s ease-in-out infinite}
  .photo .sp{position:absolute;color:#fff;animation:blink 1.6s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
  .cap{text-align:center;padding-top:10px}
  .cap .d{font:800 11px Nunito;letter-spacing:.18em;text-transform:uppercase;color:#c0577e}
  .cap .n{font-family:Caveat,cursive;font-size:36px;font-weight:700;line-height:1.05;margin-top:2px}
  .cap .t{font-size:14px;color:#6c6080;margin-top:4px}
  .actions{margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .later{background:none;border:0;color:var(--soft);font:600 14px Nunito;cursor:pointer;padding:6px}

  .conf{position:fixed;top:-14px;z-index:60;pointer-events:none;animation:fall linear forwards;font-size:18px}
  @keyframes fall{to{transform:translateY(108vh) rotate(540deg)}}
</style>
</head>

/* colores de las cajitas: [caja, cinta] */
const BOXES = [["#ff8fb3","#f5c76b"],["#7fd8be","#fff3d6"],["#9db4ff","#ff8fb3"],["#f5c76b","#e0457b"],
               ["#c49bff","#7fd8be"],["#ff7a6b","#fff3d6"],["#5fc3e4","#f5c76b"],["#ffb36b","#7a4bd6"]];
/* =================================================== */

const $ = s => document.querySelector(s);
const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let PREVIEW = location.hash === "#vistaprevia";
let realOpened = new Set(store.get("adv2_opened") || []);
let opened = PREVIEW ? new Set() : realOpened;

/* cielo */
(function(){
  const sky=$("#sky");
  for(let i=0;i<70;i++){const s=document.createElement("span");s.className="star";
    s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";s.style.animationDelay=Math.random()*3+"s";
    if(Math.random()>.85){s.style.width=s.style.height="3px"} sky.appendChild(s);}
  for(let i=0;i<18;i++){const f=document.createElement("span");f.className="flake";f.textContent=Math.random()>.5?"❄":"•";
    f.style.left=Math.random()*100+"vw";f.style.fontSize=(8+Math.random()*10)+"px";
    f.style.animationDuration=(7+Math.random()*9)+"s";f.style.animationDelay=(-Math.random()*12)+"s";document.body.appendChild(f);}
  const L=$("#lights"); for(let i=0;i<14;i++){const b=document.createElement("span");b.className="bulb";L.appendChild(b);}
})();

function limaToday(){
  const p = new Intl.DateTimeFormat("en-CA",{timeZone:"America/Lima",year:"numeric",month:"2-digit",day:"2-digit"})
            .formatToParts(new Date()).reduce((a,x)=>(a[x.type]=x.value,a),{});
  return new Date(+p.year, +p.month-1, +p.day);
}
const unlockDate = d => new Date(YEAR, MONTH-1, d);
const isUnlocked = d => PREVIEW || limaToday() >= unlockDate(d);
const pad = d => String(d).padStart(2,"0");

function renderStatus(){
  const diff = Math.round((unlockDate(1) - limaToday())/86400000);
  let txt;
  if (PREVIEW) txt = "Vista previa: todo desbloqueado 👀";
  else if (diff > 0) txt = diff === 1 ? "¡Mañana abres tu primer regalito! 🤭" : `Faltan ${diff} días para tu primer regalito 🤭`;
  else {
    const pend = GIFTS.filter((_,i)=>isUnlocked(i+1) && !opened.has(i+1)).length;
    const all = GIFTS.every((_,i)=>isUnlocked(i+1));
    txt = pend ? `Tienes ${pend} regalito${pend>1?"s":""} esperándote 🎁` : (all ? "¡Feliz Navidad, mi amor! ♥" : "Mañana hay otro, paciencia 😌");
  }
  $("#status").textContent = txt;
}

function renderOwed(){
  const list=$("#owedList"); list.innerHTML="";
  const days=[...opened].sort((a,b)=>a-b);
  $("#owedEmpty").style.display = days.length ? "none" : "block";
  days.forEach(d=>{const g=GIFTS[d-1];const li=document.createElement("li");
    li.innerHTML=`<span>${g.e}</span><span>${g.n}</span><small>día ${d}</small>`;
    li.onclick=()=>showGift(d); list.appendChild(li);});
}

function miniBow(c){
  return `<svg viewBox="0 0 140 84"><path d="M64 50 L50 80 L58 75 L63 82 L72 52 Z" fill="${c}" style="filter:brightness(.8)"/><path d="M76 50 L90 80 L82 75 L77 82 L68 52 Z" fill="${c}" style="filter:brightness(.8)"/><path d="M68 44 C52 14, 14 4, 8 26 C3 46, 34 56, 68 46 Z" fill="${c}"/><path d="M72 44 C88 14, 126 4, 132 26 C137 46, 106 56, 72 46 Z" fill="${c}"/><path d="M64 44 C50 24, 28 18, 22 28 C30 30, 48 36, 64 46 Z" fill="#000" opacity=".15"/><path d="M76 44 C90 24, 112 18, 118 28 C110 30, 92 36, 76 46 Z" fill="#000" opacity=".15"/><rect x="58" y="34" width="24" height="22" rx="8" fill="${c}" style="filter:brightness(.92)"/></svg>`;
}
function renderGrid(){
  const g=$("#grid"); g.innerHTML="";
  GIFTS.forEach((gift,i)=>{
    const d=i+1, [c,r]=BOXES[(i*3)%BOXES.length], b=document.createElement("button");
    b.className="gift"; b.style.setProperty("--c",c); b.style.setProperty("--r",r);
    b.innerHTML=`<span class="peek">${gift.e}</span><span class="ld">${miniBow(r)}</span><span class="bd"></span><span class="num">${pad(d)}</span>`;
    if (opened.has(d)) b.classList.add("opened");
    else if (isUnlocked(d)) b.classList.add("ready");
    else { b.classList.add("locked"); b.insertAdjacentHTML("beforeend",'<span class="lock">🔒</span>'); }
    b.onclick=()=>tap(d,b);
    g.appendChild(b);
  });
  renderStatus(); renderOwed();
}

let toastT;
function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),1900);}

const NOPE = ["Aún no, tramposita 🤭","¡Sin espiar! 🙈","Paciencia, mi amor 😌","Todavía no se abre 🔒"];
function tap(d,b){
  if (!isUnlocked(d)){
    b.animate([{transform:"rotate(0)"},{transform:"rotate(-8deg)"},{transform:"rotate(8deg)"},{transform:"rotate(0)"}],{duration:350});
    const f=Math.round((unlockDate(d)-limaToday())/86400000);
    toast(`${NOPE[d%NOPE.length]} · ${f===1?"mañana":"faltan "+f+" días"}`);
    return;
  }
  if (opened.has(d)) return showGift(d);
  opened.add(d); if(!PREVIEW) store.set("adv2_opened",[...opened]);
  b.classList.remove("ready"); b.classList.add("opened");
  setTimeout(()=>{ showGift(d); confetti(); renderGrid(); }, 650);
}

function showGift(d){
  const g=GIFTS[d-1];
  $("#mDay").textContent=`${d} de diciembre`;
  $("#mPhoto").style.background=`radial-gradient(circle at 30% 25%, ${g.c[0]}, ${g.c[1]})`;
  if (g.img) { $("#mPhoto").innerHTML=`<img src="${g.img}" alt="${g.n}">`; } else
  $("#mPhoto").innerHTML=[[12,14],[82,16],[16,80],[84,76],[50,8]].map(([x,y],k)=>
    `<span class="sp" style="left:${x}%;top:${y}%;animation-delay:${k*.3}s;font-size:${12+k*3}px">✦</span>`).join("")+`<span class="emo">${g.e}</span>`;
  $("#mName").textContent=g.n;
  $("#mNote").textContent=g.t;
  const msg=`🎁 Regalito del día ${d}\n\n¡Me tocó: ${g.n} ${g.e}!\n\nY me lo debes comprar 😌💕`;
  $("#mWa").href=`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`;
  $("#modal").classList.add("show");
}

function confetti(){
  const items=["❤","✦","❄","💗","⭐"], cols=["#ff8fb3","#f5c76b","#7fd8be","#fff","#9db4ff"];
  for(let i=0;i<45;i++){const c=document.createElement("div");c.className="conf";c.textContent=items[i%items.length];
    c.style.color=cols[i%cols.length];c.style.left=Math.random()*100+"vw";
    c.style.animationDuration=(2+Math.random()*2)+"s";c.style.animationDelay=Math.random()*.5+"s";
    document.body.appendChild(c);setTimeout(()=>c.remove(),4800);}
}

$("#close").onclick=()=>$("#modal").classList.remove("show");
$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").classList.remove("show");};

function enterCal(){ $("#intro").style.display="none"; $("#cal").style.display="block"; renderGrid(); }
function openBox(){
  $("#bigbox").classList.add("open"); store.set("adv2_intro",true);
  setTimeout(()=>{$("#intro").style.transition="opacity .5s";$("#intro").style.opacity=0;},1400);
  setTimeout(enterCal,1900);
}
$("#accept").onclick=openBox;
$("#bigbox").onclick=openBox;
if (store.get("adv2_intro")) enterCal();

/* truco secreto: tocar el título 5 veces activa/desactiva la vista previa */
let taps=0,tapT;
$("#title").addEventListener("click",()=>{
  taps++;clearTimeout(tapT);tapT=setTimeout(()=>taps=0,1500);
  if(taps>=5){taps=0;PREVIEW=!PREVIEW;opened=PREVIEW?new Set():realOpened;renderGrid();
    toast(PREVIEW?"Vista previa activada 👀":"Vista previa desactivada");}
});
</script>
